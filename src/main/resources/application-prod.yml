spring:
  datasource:
    url: jdbc:mysql://localhost:3306/iam_prod?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
	hikari:
	  pool-name: HikariCP       # 连接池名称
	  minimum-idle: 5           # 最小空闲连接数
	  maximum-pool-size: 50     # 最大连接数
	  idle-timeout: 300000      # 空闲连接存活时间
	  max-lifetime: 300000      # 连接最大生命周期(单位：毫秒)
	  connection-timeout: 30000      # 连接超时时间
	  connection-test-query: SELECT 1      # 验证连接的SQL
	  validation-timeout: 5000      # 验证超时时间
	  keepalive-time: 60000      # 保持连接活跃（重要）
	  read-only: false
	
# ============================
# JPA 持久化配置
# ============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      password: prod_redis_password

dubbo:
  application:
    name: Dubbo-IAM-Center
  registry:
    address: zookeeper://localhost:2181
  protocol:
    name: dubbo
    port: 28080
  consumer:
    check: false
    lazy: true

jwt:
  secret: "jvbXZIyM8J5ZiVYsOx"  # 生成方式：openssl rand -base64 32
  expiration: 3600000           # 1小时，单位毫秒
  issuer: "www.iam-center.com"